server:
  port: 8080

spring:
  application:
    name: sentinel

  datasource:
    url: jdbc:postgresql://localhost:5433/sentinel
    username: sentinel
    password: sentinel

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sentinel-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.sentinel.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

sentinel:
  kafka:
    topic: transactions
    cases-opened-topic: fraud-cases-opened
  simulator:
    enabled: true
    interval-ms: 4000
  rules:
    velocity:
      max-transactions-per-minute: 5
    amount:
      high-value-threshold: 5000.00
      deviation-multiplier: 4.0
  anomaly:
    flag-threshold: 0.65
    min-history-for-stddev: 3
    zscore-cap: 4.0
  investigation:
    similar-cases-k: 5
    recent-history-limit: 5
  llm:
    # anthropic (default, the project's committed provider) | ollama (free local
    # testing only — requires Ollama running locally, never the shipped default)
    provider: anthropic
    # Read from the ANTHROPIC_API_KEY environment variable — never hardcode it here.
    # Empty default so the app still starts without it; the investigation agent
    # will fail gracefully (retry, then INVESTIGATION_FAILED) if it's unset.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-4-5-20251001
    max-tokens: 1024
    max-attempts: 3
    initial-backoff-ms: 1000
    ollama:
      base-url: http://localhost:11434
      model: llama3.2

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
